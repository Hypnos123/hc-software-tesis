<button class="chatbot-floating-btn" type="button" title="Abrir Asistente IA" aria-label="Abrir Asistente IA" (click)="toggleChat()"><i class="pi pi-comments"></i></button>
<aside *ngIf="autenticado && !isOpen" class="chatbot-floating-message" [class.visible]="mensajeFlotanteVisible" aria-live="polite">
  <span>{{ mensajeFlotante }}</span>
  <button type="button" title="Cerrar mensaje" aria-label="Cerrar mensaje del asistente" (click)="cerrarMensajeFlotante()">×</button>
</aside>

<div class="chatbot-window" *ngIf="isOpen">
  <div class="chatbot-header">
    <div><h4>Asistente IA</h4><span>Control de historias clínicas</span></div>
    <div class="chatbot-header-actions">
      <button class="chatbot-minimize" type="button" title="Minimizar" aria-label="Minimizar" (click)="minimizeChat()">−</button>
      <button class="chatbot-close" type="button" title="Cerrar y borrar conversación" aria-label="Cerrar y borrar conversación" (click)="closeChat()">×</button>
    </div>
  </div>

  <div class="chatbot-body" #chatBody (scroll)="onChatBodyScroll()">
    <ng-container *ngFor="let message of messages">
      <div #conversationBlock *ngIf="message.type === 'text' && message.presentationState !== 'pending'" [attr.data-block-id]="message.id" [ngClass]="message.sender === 'bot' ? 'bot-message' : 'user-message'">{{ message.visibleText }}</div>
      <div #conversationBlock *ngIf="message.type === 'menu'" [hidden]="message.presentationState !== 'visible'" [attr.data-block-id]="message.id" class="navigation-options" [class.main-categories]="message.menuId === 'principal'" aria-label="Opciones del asistente">
        <button *ngFor="let option of message.options || []" type="button" class="navigation-option" [class.category-card]="message.menuId === 'principal'" [disabled]="isLoading || gestionHistoriasDuplicadasActiva" [title]="option.description || option.label" (click)="selectHistoricalMenuOption(message, option)">
          <i *ngIf="option.icon" [class]="option.icon" aria-hidden="true"></i>
          <span class="option-content"><strong>{{ option.label }}</strong><small *ngIf="option.description">{{ option.description }}</small></span>
        </button>
        <p *ngIf="(message.options || []).length === 0" class="menu-options-completed">Ya revisaste todas las opciones disponibles de esta sección.</p>
      </div>
      <div #conversationBlock *ngIf="message.type === 'patient-import' && message.importacion" [hidden]="message.presentationState !== 'visible'" [attr.data-block-id]="message.id" class="bot-message import-message-block">
        <app-importacion-pacientes-chat [state]="message.importacion" [view]="message.importView!" [active]="!!message.importActive" (mensajeConversacional)="manejarMensajeImportacion(message.importacion, $event)" (registrarOtro)="registrarOtroArchivo()" (volverPacientes)="mostrarOpcionesPacientes()"></app-importacion-pacientes-chat>
      </div>
      <div #conversationBlock *ngIf="message.type === 'duplicate-management' && message.duplicados" [hidden]="message.presentationState !== 'visible'" [attr.data-block-id]="message.id" class="bot-message duplicate-message-block">
        <app-gestion-duplicados-chat [state]="message.duplicados" [view]="message.duplicateView!" [active]="!!message.duplicateActive" (mensajeConversacional)="manejarMensajeGestionDuplicados(message.duplicados, $event)"></app-gestion-duplicados-chat>
      </div>
      <div #conversationBlock *ngIf="message.type === 'missing-clinical-histories' && message.historiasFaltantes" [hidden]="message.presentationState !== 'visible'" [attr.data-block-id]="message.id" class="bot-message missing-histories-message-block">
        <app-historias-clinicas-faltantes-chat [state]="message.historiasFaltantes" [view]="message.missingHistoriesView!" [active]="!!message.missingHistoriesActive" (mensajeConversacional)="manejarMensajeHistoriasFaltantes(message.historiasFaltantes, $event)"></app-historias-clinicas-faltantes-chat>
      </div>
      <div #conversationBlock *ngIf="message.type === 'clinical-history-duplicate-management' && message.historiasDuplicadas" [hidden]="message.presentationState !== 'visible'" [attr.data-block-id]="message.id" class="bot-message duplicate-histories-message-block">
        <app-gestion-historias-duplicadas-chat [state]="message.historiasDuplicadas" [view]="message.duplicateHistoriesView!" [active]="!!message.duplicateHistoriesActive" (mensajeConversacional)="manejarMensajeHistoriasDuplicadas(message.historiasDuplicadas, $event)"></app-gestion-historias-duplicadas-chat>
      </div>
    </ng-container>
    <div *ngIf="asistenteEscribiendo" class="assistant-typing-indicator" role="status" aria-live="polite">Asistente escribiendo…</div>
  </div>

  <div *ngIf="autenticado" class="quick-questions" aria-label="Preguntas rápidas">
    <button *ngFor="let question of quickQuestions" type="button" (click)="quickAsk(question)" [disabled]="isLoading || gestionDuplicadosActiva || gestionHistoriasDuplicadasActiva" [title]="question">{{ question }}</button>
  </div>

  <div *ngIf="clinicalHistoryFlow.step !== 'idle'" class="clinical-history-flow-actions" aria-label="Acciones de creación de historia clínica">
    <button *ngIf="clinicalHistoryFlow.step === 'awaitingConfirmation'" type="button" class="continue-action" (click)="continueClinicalHistoryFlow()" title="Continuar con el paciente seleccionado">Continuar</button>
    <button type="button" class="cancel-action" (click)="cancelClinicalHistoryFlow()" [disabled]="clinicalHistoryFlow.step === 'navigating'" title="Cancelar creación de historia clínica">Cancelar</button>
  </div>

  <div *ngIf="gestionDuplicadosActiva" class="duplicate-flow-actions" aria-label="Acciones de gestión de pacientes duplicados">
    <button type="button" class="cancel-action" (click)="cancelarGestionDuplicados()" title="Cancelar gestión de paciente duplicado">Cancelar</button>
  </div>

  <div *ngIf="autenticado" class="chatbot-footer">
    <input type="text" placeholder="Escribe tu consulta..." aria-label="Escribe tu consulta" [(ngModel)]="userMessage" (keydown.enter)="onEnter($event)" [disabled]="isLoading || gestionDuplicadosActiva || gestionHistoriasDuplicadasActiva" />
    <button type="button" title="Enviar consulta" aria-label="Enviar consulta" (click)="sendMessage()" [disabled]="isLoading || gestionDuplicadosActiva || gestionHistoriasDuplicadasActiva || !userMessage.trim()">Enviar</button>
  </div>
</div>
